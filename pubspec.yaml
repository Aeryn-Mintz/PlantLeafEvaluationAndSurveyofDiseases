name: pleased
description: Photographic Leaf Evaluation and Survey Environmental Diagnostics
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter

  tflite_flutter: ^0.12.1
  
  # Ícones padrão do Flutter
  cupertino_icons: ^1.0.2
  
  # Bibliotecas do PLEASED (Download e IA)
  dio: ^5.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.2.2
  image_picker: ^1.2.3
  image: ^4.9.1
  http: ^1.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21 # Optional, but good practice
flutter:
  uses-material-design: true

  
